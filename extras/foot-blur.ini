# Append to ~/.config/foot/foot.ini (Foot 1.28+).
# Do NOT put these under a bare [colors] section — use colors-dark / colors-light.
# Hyprland terminal windows should stay opacity 1.0; Foot owns the frosted look.
# alpha-mode=all is required for TUI glass: gum/agents paint explicit cell
# backgrounds; without it those plates stay fully opaque over the blur.
#
# NOT applied by `omarchy theme install` — foot.ini is regenerated from colors.toml.
# Open a new Foot window after changing alpha / alpha-mode / blur.

[colors-dark]
foreground=ffffff
alpha=0.8
alpha-mode=all
blur=yes

[colors-light]
foreground=ffffff
alpha=0.8
alpha-mode=all
blur=yes
