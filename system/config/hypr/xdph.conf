# Screen sharing portal (xdg-desktop-portal-hyprland).
# Keep the HDR/10-bit *display*; only change how frames are fed to PipeWire.
#
# force_shm: Discord/Chromium on NVIDIA was dying mid-Go-Live after DMA-BUF
#            screencopy hit "Out of buffers" / NVRM mapping OOM, then SIGTRAP.
#            SHM avoids the GPU dmabuf path for capture clients.
# max_fps:   Cap capture rate to what Discord actually streams (~30).
screencopy {
    allow_token_by_default = true
    custom_picker_binary = hyprland-preview-share-picker
    force_shm = true
    max_fps = 30
}
