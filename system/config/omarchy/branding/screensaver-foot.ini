[main]
font=JetBrainsMono Nerd Font:size=18
pad=0x0

# Frosted live wallpaper behind ttfx (Foot ext-background-effect-v1).
# Keep alpha low enough that dark adaptive wallpapers still read through the
# black tint; alpha-mode=all so ttfx-painted blacks stay translucent too.
[colors-dark]
background=000000
foreground=ffffff
alpha=0.32
alpha-mode=all
blur=yes

[colors-light]
background=000000
foreground=ffffff
alpha=0.32
alpha-mode=all
blur=yes
