[main]
include=~/.local/state/omarchy/current/theme/foot.ini
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9
pad=14x14
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

# Foot 1.28+: alpha/blur live under colors-dark and colors-light.
# Native blur via Hyprland's ext-background-effect-v1 — same 0.96 as Chromium.
# alpha-mode=all: TUI-painted cell backgrounds (gum, agents, …) frost too —
# default mode only alphas the terminal default bg, so explicit #000 plates stay opaque.
# foreground override survives theme regenerates of the included foot.ini.
[colors-dark]
foreground=ffffff
alpha=0.55
alpha-mode=all
blur=yes

[colors-light]
foreground=ffffff
alpha=0.8
alpha-mode=all
blur=yes

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
