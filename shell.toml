# 43PR Plume — Omarchy shell surfaces.
# Smoked glass: a near-black tint over Hyprland blur, soft off-white type,
# frosted (not solid) selected states.
# Surface fills (#101010 @ 0.75): off-white type needs a dark plate under it.
# The old clear fill (#1a1a1a @ 0.10) left white text on white wallpapers
# unreadable; 0.75 keeps ~5:1 contrast there and still shows blur on dark ones.
# Keep every glass alpha above the blur ignore_alpha (0.08) in looknfeel.lua,
# and every scrim at or below it so the backdrop dims without blurring.

[bar]
background       = "#000000"
background-alpha = 0.0
text             = "#ececec"
active           = "#ececec"
scale-with-font  = true
size-horizontal  = 24
size-vertical    = 26

[hyprland]
active-border            = "rgba(ffffff99) rgba(ffffff26) 45deg"
active-border-foreground = "rgba(ffffff73) rgba(ffffff1a) 45deg"

[controls]
normal-color        = "#ececec"
normal-fill-alpha   = 0.06
normal-border       = "#ffffff"
normal-border-width = 1
normal-border-alpha = 0.12

hover-cursor-color        = "#ececec"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#ffffff"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.20

focus-color        = "#ececec"
focus-fill-alpha   = 0.10
focus-border       = "#ffffff"
focus-border-width = 1
focus-border-alpha = 0.20

selected-color        = "#ececec"
selected-fill-alpha   = 0.16
selected-border       = "#ffffff"
selected-border-width = 1
selected-border-alpha = 0.30

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true

[font]
base-size = 11

[popups]
background       = "#101010"
background-alpha = 0.75
text             = "#ececec"
border           = "hyprland.active-border"
border-alpha     = 1.0

[tooltip]
background       = "#101010"
background-alpha = 0.75
text             = "#ececec"
border           = "hyprland.active-border-foreground"
border-alpha     = 1.0

[notifications]
background       = "#101010"
background-alpha = 0.75
text             = "#ececec"
border           = "hyprland.active-border"
border-alpha     = 1.0
countdown        = "#ececec"

[launcher]
background                = "#101010"
background-alpha          = 0.75
text                      = "#ececec"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#000000"
scrim-alpha               = 0.07
selected-background       = "#ffffff"
selected-background-alpha = 0.16
selected-text             = "#ececec"
selected-border           = "#ffffff"
selected-border-alpha     = 0.30

[menu]
background                = "#101010"
background-alpha          = 0.75
text                      = "#ececec"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#000000"
scrim-alpha               = 0.07
selected-background       = "#ffffff"
selected-background-alpha = 0.16
selected-text             = "#ececec"
selected-border           = "#ffffff"
selected-border-alpha     = 0.30

[polkit]
background       = "#101010"
background-alpha = 0.75
text             = "#ececec"
text-error       = "#ececec"
border           = "hyprland.active-border"
border-error     = "#a8a8a8"
border-alpha     = 1.0
scrim            = "#000000"
scrim-alpha      = 0.07
accent           = "#bcbcbc"

[lock]
background       = "#101010"
background-alpha = 0.75
text             = "#ececec"
placeholder      = "#b0b0b0"
text-error       = "#ececec"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#a8a8a8"
border-alpha     = 1.0

[image-picker]
scrim                   = "#000000"
scrim-alpha             = 0.07
text                    = "#ececec"
selected-border         = "#ececec"
selected-border-alpha   = 1.0
unselected-border       = "#ffffff"
unselected-border-alpha = 0.25
