mode = "dark"

accent = "#aaaaaa"
# Mid gray: readable when Foot frosts selection under alpha-mode=all
# (was #2a2a2a — invisible once selection shares window alpha; see extras/foot-selection-alpha.patch).
selection = "#666666"
selection_foreground = "#ececec"
# Visible on Foot alpha/blur (was #3c3c3c — ANSI dim/bright0, nearly invisible).
muted = "#888888"

background = "#000000"
dark_background = "#0d0d0d"
darker_background = "#000000"
lighter_background = "#191919"

# Plume: a touch under pure white (pure white read too contrasty on glass).
foreground = "#ececec"
dark_foreground = "#5d5d5d"
light_foreground = "#e0e0e0"
bright_foreground = "#ececec"

# Glass rim: bright top-left edge fading across the window.
hyprland_active_border = "rgba(ffffff99) rgba(ffffff26) 45deg"
hyprland_inactive_border = "rgba(ffffff1f)"
active_border_color = "#aaaaaa"
active_tab_background = "#aaaaaa"

red = "#e8e8e8"
yellow = "#b0b0b0"
orange = "#a7a7a7"
green = "#d0d0d0"
cyan = "#bcbcbc"
blue = "#a0a0a0"
magenta = "#d8d8d8"
brown = "#3c3c3c"

bright_red = "#ececec"
bright_yellow = "#d0d0d0"
bright_green = "#e8e8e8"
bright_cyan = "#d8d8d8"
bright_blue = "#c0c0c0"
bright_magenta = "#f0f0f0"
