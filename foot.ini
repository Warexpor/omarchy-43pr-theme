# 43PR: shipped instead of the generated template so [colors-light] carries
# the same grayscale palette. ~/.config/foot/foot.ini sets glass on dark and
# solid on light; Super+Backspace flips a Foot window between them.
# Keep both palettes in sync with colors.toml.
[colors-dark]
foreground=ececec
background=000000
selection-foreground=ececec
selection-background=666666

cursor=000000 ececec

regular0=000000
regular1=e8e8e8
regular2=d0d0d0
regular3=b0b0b0
regular4=a0a0a0
regular5=d8d8d8
regular6=bcbcbc
regular7=ececec

bright0=888888
bright1=ececec
bright2=e8e8e8
bright3=d0d0d0
bright4=c0c0c0
bright5=f0f0f0
bright6=d8d8d8
bright7=ececec

[colors-light]
